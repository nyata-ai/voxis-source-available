name: OSS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.14'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Regenerate and verify checked-in SQL code
        working-directory: backend
        run: make sqlc-check
      - name: Validate OpenAPI
        working-directory: backend
        run: make openapi-check
      - name: Lint, build, and race coverage test backend
        working-directory: backend
        run: |
          make lint
          make build
          make test-coverage

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        # Same locked image as infra/oss/images.lock.yaml (postgres:16.15-alpine3.24).
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: voxis_oss_test
          POSTGRES_USER: voxis_oss_test
          POSTGRES_PASSWORD: oss-ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voxis_oss_test -d voxis_oss_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      OSS_TEST_DATABASE_URL: postgresql://voxis_oss_test:oss-ci-test@localhost:5432/voxis_oss_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.14'
          cache-dependency-path: backend/go.sum
      - name: Run PostgreSQL integration tests
        run: go test -race -count=1 -timeout=20m -tags=integration ./internal/adapter/postgres/...

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build:strict

  composition:
    name: composition
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate operator and smoke Compose configurations
        run: |
          docker compose --env-file editions/oss/.env.ci -f infra/oss/compose.yaml config --quiet
          docker compose --profile app --env-file editions/oss/.env.ci -f infra/oss/compose.yaml -f infra/oss/compose.smoke.yaml config --quiet
          bash infra/oss/scripts/test-restore-approle-environment.sh
          bash infra/oss/scripts/test-backup-token-cleanup.sh
          bash infra/oss/scripts/test-keycloak-realm-template.sh
      - name: Check restore archive validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age >/dev/null
          bash infra/oss/scripts/test-restore-archive-validation.sh
